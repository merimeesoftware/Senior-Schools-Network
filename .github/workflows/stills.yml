# Read-only visual check. This does not deploy and does not use secrets.
# Workers Builds remains the only deploy path.

name: stills

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch base branch
        run: git fetch origin "${GITHUB_BASE_REF:-main}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright-core install --with-deps chromium

      - name: Allow Chromium sandbox user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Stills self-test
        run: bun run test:stills

      - name: Capture stills
        run: bun run stills

      - name: Upload stills
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checks-out
          path: checks-out/
          if-no-files-found: warn
